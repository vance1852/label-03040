server:
  port: 8080
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:apk_signer}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

apk-signer:
  upload-dir: ${UPLOAD_DIR:/data/uploads}
  signed-dir: ${SIGNED_DIR:/data/signed}
  keystore-dir: ${KEYSTORE_DIR:/data/keystores}
  file-retention-hours: ${FILE_RETENTION_HOURS:24}
  base-url: ${BASE_URL:http://localhost:8080}

logging:
  level:
    com.apksigner: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
